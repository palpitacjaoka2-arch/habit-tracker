<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f0f0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Habits"/>
<title>Daily Habits</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #181818;
  --bg3: #222;
  --bg4: #2a2a2a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0ede8;
  --text2: rgba(240,237,232,0.45);
  --text3: rgba(240,237,232,0.22);
  --accent: #d4b896;
  --accent-dim: rgba(212,184,150,0.1);
  --green: #6fcf97;
  --green-dim: rgba(111,207,151,0.1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }

#app { max-width: 480px; margin: 0 auto; padding-bottom: calc(var(--safe-bot) + 80px); }

/* ── STATUS BAR SPACER ── */
.status-space { height: calc(var(--safe-top) + 12px); }

/* ── HEADER ── */
.header { padding: 0 20px 16px; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }
.day-name { font-size: 28px; font-weight: 300; color: var(--text); letter-spacing: -0.5px; }
.day-name strong { font-weight: 500; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 4px; }
.full-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }
.streak-badge { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); background: var(--accent-dim); padding: 3px 9px; border-radius: 20px; }

/* ── VIEW TABS ── */
.tabs { display: flex; gap: 4px; padding: 0 20px 20px; }
.tab { flex: 1; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.tab.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
.tab:active:not(.active) { background: var(--bg3); }

/* ── DAY VIEW ── */
.day-view { padding: 0 20px; }
.day-complete-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.bar-track { flex: 1; height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 3px; border-radius: 2px; background: var(--accent); transition: width 0.4s ease; }
.bar-fill.full { background: var(--green); }
.bar-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); min-width: 36px; text-align: right; }
.activity-list { display: flex; flex-direction: column; gap: 2px; }
.activity-row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; border-radius: 12px;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: background 0.15s;
  border: 0.5px solid transparent;
}
.activity-row:active { background: var(--bg3); }
.activity-row.checked { background: var(--bg2); border-color: var(--border); }
.act-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.act-name { flex: 1; font-size: 15px; color: var(--text); transition: color 0.2s; }
.activity-row.checked .act-name { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--text3); }
.act-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; transition: all 0.2s; }
.activity-row.checked .act-check { background: var(--green); border-color: var(--green); color: var(--bg); }
.rest-day { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 15px; line-height: 1.6; }
.rest-day .rest-icon { font-size: 32px; margin-bottom: 10px; }

/* ── WEEK VIEW ── */
.week-view { padding: 0 20px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.week-nav-btn { width: 34px; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.week-nav-btn:active { background: var(--bg3); }
.week-range { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); }
.week-grid { display: flex; flex-direction: column; gap: 6px; }
.week-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px;
  border: 0.5px solid var(--border);
  background: var(--bg2); cursor: pointer;
  transition: border-color 0.15s;
}
.week-row.today-row { border-color: var(--border2); }
.week-row.full-row { border-color: rgba(111,207,151,0.3); }
.week-row:active { background: var(--bg3); }
.week-dow { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); width: 28px; flex-shrink: 0; }
.week-dow.today-dow { color: var(--accent); }
.week-date-num { font-size: 15px; font-weight: 500; color: var(--text2); width: 24px; flex-shrink: 0; }
.week-date-num.today-num { color: var(--text); }
.week-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.week-bar-track { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.week-bar-fill { height: 3px; border-radius: 2px; background: var(--accent); transition: width 0.4s; }
.week-bar-fill.wfull { background: var(--green); }
.week-acts { font-size: 11px; color: var(--text3); }
.week-score { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); min-width: 32px; text-align: right; }
.week-score.wscore-full { color: var(--green); }
.week-score.wscore-today { color: var(--accent); }

/* ── MONTH VIEW ── */
.month-view { padding: 0 20px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.month-nav-btn { width: 34px; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.month-nav-btn:active { background: var(--bg3); }
.month-title { font-size: 15px; font-weight: 500; color: var(--text); }
.month-dow-row { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
.month-dow-cell { text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); padding: 4px 0; }
.month-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.month-cell {
  aspect-ratio: 1; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; border: 0.5px solid transparent;
  transition: border-color 0.15s;
}
.month-cell:active { background: var(--bg3); }
.month-cell.empty { cursor: default; }
.month-cell.today-cell { border-color: var(--border2); }
.month-cell.full-cell { background: var(--green-dim); border-color: rgba(111,207,151,0.25); }
.month-cell.partial-cell { background: var(--accent-dim); border-color: rgba(212,184,150,0.15); }
.month-cell.future-cell { opacity: 0.35; }
.month-cell .mcell-num { font-size: 14px; font-weight: 400; color: var(--text2); line-height: 1; }
.month-cell.today-cell .mcell-num { color: var(--text); font-weight: 500; }
.month-cell.full-cell .mcell-num { color: var(--green); }
.month-cell.partial-cell .mcell-num { color: var(--accent); }
.month-cell .mcell-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 3px; }
.month-cell.full-cell .mcell-dot { background: var(--green); }
.month-cell.partial-cell .mcell-dot { background: var(--accent); }
.month-cell.today-cell:not(.full-cell):not(.partial-cell) .mcell-dot { background: var(--text3); }

/* ── MONTH STREAK ROW ── */
.month-streak-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.streak-chip { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: var(--bg2); border: 0.5px solid var(--border); font-size: 12px; color: var(--text2); }
.streak-chip-icon { font-size: 14px; }
.streak-chip strong { color: var(--text); font-weight: 500; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15,15,15,0.92); backdrop-filter: blur(12px);
  border-top: 0.5px solid var(--border2);
  padding: 10px 20px calc(var(--safe-bot) + 10px);
  display: flex; justify-content: center;
}
.bottom-nav-inner { display: flex; gap: 4px; max-width: 480px; width: 100%; }

/* ── DAY DETAIL SHEET (from week/month tap) ── */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; display: none; align-items: flex-end; }
.sheet-backdrop.open { display: flex; }
.sheet { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; max-height: 80vh; overflow-y: auto; padding-bottom: calc(var(--safe-bot) + 20px); }
.sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 0; }
.sheet-head { padding: 16px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
.sheet-title { font-size: 17px; font-weight: 500; color: var(--text); }
.sheet-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }
.sheet-close { font-size: 22px; color: var(--text3); cursor: pointer; padding: 0 0 0 12px; }
.sheet-acts { padding: 8px 12px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: calc(var(--safe-bot) + 90px); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 20px; padding: 8px 16px; font-size: 13px; color: var(--text2); opacity: 0; transition: all 0.25s; pointer-events: none; white-space: nowrap; z-index: 200; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.backup-sheet { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; padding: 0 0 calc(var(--safe-bot) + 24px); }
.backup-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 0.5px solid var(--border); cursor: pointer; }
.backup-row:active { background: var(--bg3); }
.backup-icon { font-size: 20px; width: 28px; text-align: center; }
.backup-text-title { font-size: 15px; color: var(--text); }
.backup-text-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.schedule-day-row { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-top: 0.5px solid var(--border); cursor: pointer; }
.schedule-day-row:active { background: var(--bg3); }
.schedule-day-name { flex: 1; font-size: 15px; color: var(--text); }
.schedule-day-count { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
.schedule-day-arrow { font-size: 16px; color: var(--text3); }
.schedule-act-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.schedule-act-icon-input { width: 36px; height: 36px; border-radius: 8px; background: var(--bg3); border: 0.5px solid var(--border2); font-size: 18px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.schedule-act-name { flex: 1; font-size: 14px; color: var(--text); }
.schedule-act-del { font-size: 22px; color: var(--text3); cursor: pointer; padding: 0 4px; flex-shrink: 0; }
.schedule-act-del:active { color: #eb5757; }
.schedule-back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); cursor: pointer; padding: 4px 0 12px; }

/* ── REPORT VIEW ── */
.report-view { padding: 0 20px; }
.report-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.report-nav-btn { width: 34px; height: 34px; border-radius: 10px; border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.report-nav-btn:active { background: var(--bg3); }
.report-month-title { font-size: 15px; font-weight: 500; color: var(--text); }
.report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
.report-stat { background: var(--bg2); border-radius: 12px; padding: 12px; }
.report-stat-n { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--text); }
.report-stat-n.good { color: var(--green); }
.report-stat-n.bad { color: #eb5757; }
.report-stat-n.accent { color: var(--accent); }
.report-stat-l { font-size: 11px; color: var(--text3); margin-top: 2px; }
.report-section-title { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.report-day-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.report-day-card.incomplete { border-color: rgba(235,87,87,0.2); }
.report-day-card.complete { border-color: rgba(111,207,151,0.2); }
.report-day-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
.report-day-left { display: flex; align-items: center; gap: 10px; }
.report-day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.report-day-dot.complete { background: var(--green); }
.report-day-dot.incomplete { background: #eb5757; }
.report-day-dot.partial { background: var(--accent); }
.report-day-name { font-size: 14px; font-weight: 500; color: var(--text); }
.report-day-date { font-size: 11px; color: var(--text3); margin-top: 1px; }
.report-day-score { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text3); }
.report-day-score.complete { color: var(--green); }
.report-day-score.incomplete { color: #eb5757; }
.report-day-body { border-top: 0.5px solid var(--border); padding: 10px 14px; display: none; }
.report-day-body.open { display: block; }
.report-sub-title { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; margin: 8px 0 6px; }
.report-sub-title:first-child { margin-top: 0; }
.report-act-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
.report-act-icon { font-size: 13px; width: 18px; text-align: center; }
.report-act-name { color: var(--text2); }
.report-act-name.done { color: var(--text3); text-decoration: line-through; }
.report-event-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }
.report-event-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex-shrink: 0; }
.report-event-title { font-size: 13px; color: var(--text2); flex: 1; }
.report-event-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; }
.report-empty { text-align: center; padding: 32px 0; color: var(--text3); font-size: 14px; }
.report-loading { text-align: center; padding: 40px 0; color: var(--text3); font-size: 14px; }
.report-cal-empty { font-size: 13px; color: var(--text3); font-style: italic; padding: 2px 0; }
.report-streak-section { margin-bottom: 24px; }
.streak-timeline { display: flex; flex-wrap: wrap; gap: 4px; }
.streak-cell { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'DM Mono', monospace; }
.streak-cell.sc-complete { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(111,207,151,0.2); }
.streak-cell.sc-partial { background: var(--accent-dim); color: var(--accent); border: 0.5px solid rgba(212,184,150,0.2); }
.streak-cell.sc-miss { background: var(--bg2); color: var(--text3); border: 0.5px solid var(--border); }
.streak-cell.sc-future { background: transparent; color: var(--text3); border: 0.5px solid var(--border); opacity: 0.3; }
.streak-cell.sc-rest { background: transparent; color: var(--text3); opacity: 0.2; }
</style>
</head>
<body>
<div id="app">
  <div class="status-space"></div>
  <div class="header">
    <div class="header-top">
      <div class="day-name" id="day-name-el"></div>
      <div class="header-right">
        <button class="settings-btn" id="backup-btn" aria-label="Backup / Restore data">💾</button>
        <div class="full-date" id="full-date-el"></div>
        <div class="streak-badge" id="streak-el" style="display:none"></div>
      </div>
    </div>
  </div>
  <input type="file" id="import-file" accept=".json" style="display:none"/>
  <div class="tabs">
    <button class="tab active" id="tab-day" onclick="switchView('day')">Day</button>
    <button class="tab" id="tab-week" onclick="switchView('week')">Week</button>
    <button class="tab" id="tab-month" onclick="switchView('month')">Month</button>
  </div>

  <div id="view-day" class="day-view"></div>
  <div id="view-week" class="week-view" style="display:none"></div>
  <div id="view-month" class="month-view" style="display:none"></div>
</div>

<!-- Sheet -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-sub" id="sheet-sub"></div>
      </div>
      <div class="sheet-close" onclick="closeSheet()">×</div>
    </div>
    <div class="sheet-acts" id="sheet-acts"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Backup sheet -->
<div class="sheet-backdrop" id="backup-backdrop">
  <div class="backup-sheet">
    <div class="sheet-handle"></div>
    <div style="padding:16px 20px 8px; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;">Data & Backup</div>
      <div style="font-size:22px;color:var(--text3);cursor:pointer;padding:0 0 0 12px;" onclick="document.getElementById('backup-backdrop').classList.remove('open')">×</div>
    </div>
    <div class="backup-row" id="export-btn">
      <div class="backup-icon">☁️</div>
      <div>
        <div class="backup-text-title">Save to Supabase</div>
        <div class="backup-text-sub">Push your current data to the cloud</div>
      </div>
    </div>
    <div class="backup-row" id="import-btn">
      <div class="backup-icon">🔄</div>
      <div>
        <div class="backup-text-title">Restore from Supabase</div>
        <div class="backup-text-sub">Pull your data back from the cloud</div>
      </div>
    </div>
    <div class="backup-row" id="edit-schedule-btn">
      <div class="backup-icon">✏️</div>
      <div>
        <div class="backup-text-title">Edit weekly schedule</div>
        <div class="backup-text-sub">Change activities per day of the week</div>
      </div>
    </div>
  </div>
</div>

<!-- Edit schedule sheet -->
<div class="sheet-backdrop" id="schedule-backdrop">
  <div class="sheet" style="max-height:92vh;">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="schedule-sheet-title">Edit Schedule</div>
        <div class="sheet-sub" id="schedule-sheet-sub"></div>
      </div>
      <div class="sheet-close" onclick="closeScheduleSheet()">×</div>
    </div>
    <div id="schedule-day-list" style="padding:8px 12px 0;"></div>
    <div id="schedule-edit-day" style="padding:8px 12px; display:none;">
      <div id="schedule-act-list" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;padding:8px 0 16px;">
        <input type="text" id="schedule-new-input" placeholder="New activity name…" maxlength="50"
          style="flex:1;font-size:14px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:10px;padding:0 12px;height:40px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;" />
        <button id="schedule-add-btn" style="height:40px;padding:0 14px;border-radius:10px;background:var(--accent);border:none;color:var(--bg);font-size:20px;cursor:pointer;">+</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = 'habits_v4';

/* ── SCHEDULE: 0=Sun,1=Mon,...,6=Sat ── */
const DEFAULT_SCHEDULE = {
  1: [ // Monday
    { icon: '📖', name: 'Reading on the balcony' },
    { icon: '🏃', name: 'Treadmill 1h' },
    { icon: '🚶', name: 'Midday walk' },
    { icon: '🧘', name: 'Mobility 10 min' },
    { icon: '🤖', name: 'Learning AI' },
  ],
  2: [ // Tuesday
    { icon: '📖', name: 'Reading on the balcony' },
    { icon: '🏋️', name: 'Gym 1h' },
    { icon: '🚶', name: 'Midday walk' },

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayDate() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function diffDays(a, b) { return Math.round((a - b) / 86400000); }

function save(s) { syncToSupabase(s); }
let state = loadLocal();

function activitiesFor(dateObj) {
  const schedule = (state && state.schedule) ? state.schedule : DEFAULT_SCHEDULE;
  return schedule[dateObj.getDay()] || [];
}

function isComplete(dateObj) {
  const acts = activitiesFor(dateObj);
  if (!acts.length) return null; // rest day
  const ds = dateStr(dateObj);
  return acts.every(a => state.log[ds] && state.log[ds][a.name]);
}

function completionOf(dateObj) {
  const acts = activitiesFor(dateObj);
  if (!acts.length) return null;
  const ds = dateStr(dateObj);
  const done = acts.filter(a => state.log[ds] && state.log[ds][a.name]).length;
  return { done, total: acts.length };
}

function toggle(dateObj, actName) {
  const ds = dateStr(dateObj);
  if (!state.log[ds]) state.log[ds] = {};
  state.log[ds][actName] = !state.log[ds][actName];
  save(state);
}

/* ── STREAK (consecutive fully-completed days, active days only) ── */
function calcStreak() {
  const today = todayDate();
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = addDays(today, -i);
    const acts = activitiesFor(d);
    if (!acts.length) continue; // skip rest days
    if (isComplete(d)) streak++;
    else break;
  }
  return streak;
}

/* ── DAY VIEW ── */
function renderDay(dateObj) {
  renderHeader(dateObj);
  const acts = activitiesFor(dateObj);
  const el = document.getElementById('view-day');
  if (!acts.length) {
    el.innerHTML = `<div class="rest-day"><div class="rest-icon">☀️</div>Rest day.<br>Nothing scheduled today.</div>`;
    return;
  }
  const ds = dateStr(dateObj);
  const done = acts.filter(a => state.log[ds] && state.log[ds][a.name]).length;
  const pct = Math.round((done/acts.length)*100);
  const isFull = done === acts.length;

  let html = `<div class="day-complete-bar">
    <div class="bar-track"><div class="bar-fill ${isFull?'full':''}" style="width:${pct}%"></div></div>
    <div class="bar-label">${done}/${acts.length}</div>
  </div><div class="activity-list">`;

  acts.forEach(a => {
    const checked = !!(state.log[ds] && state.log[ds][a.name]);
    html += `<div class="activity-row ${checked?'checked':''}" data-act="${encodeURIComponent(a.name)}" role="checkbox" aria-checked="${checked}" tabindex="0">
      <div class="act-icon">${a.icon}</div>
      <div class="act-name">${a.name}</div>
      <div class="act-check">${checked?'✓':''}</div>

  el.querySelectorAll('.activity-row').forEach(row => {

    row.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){e.preventDefault();doIt();} });
  });
}

/* ── WEEK VIEW ── */
function renderWeek() {
  const today = todayDate();
  const startOfWeek = addDays(today, weekOffset * 7);
  const dow = startOfWeek.getDay();
  const monday = addDays(startOfWeek, -(dow === 0 ? 6 : dow - 1));

  const from = monday.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const sun = addDays(monday, 6);
  const to = sun.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

  let html = `<div class="week-nav">
    <button class="week-nav-btn" onclick="shiftWeek(-1)">‹</button>
    <div class="week-range">${from} – ${to}</div>
    <button class="week-nav-btn" onclick="shiftWeek(1)">›</button>
  </div><div class="week-grid">`;

  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const isToday = dateStr(d) === dateStr(today);
    const isFuture = d > today;
    const comp = completionOf(d);
    const isFull = comp && comp.done === comp.total;
    const pct = comp ? Math.round((comp.done/comp.total)*100) : 0;

    let scoreStr = comp ? `${comp.done}/${comp.total}` : '—';
    let scoreClass = '';
    if (isFull) scoreClass = 'wscore-full';
    else if (isToday) scoreClass = 'wscore-today';

    html += `<div class="week-row ${isToday?'today-row':''} ${isFull&&!isFuture?'full-row':''}" data-date="${dateStr(d)}" role="button" tabindex="0">
      <div class="week-dow ${isToday?'today-dow':''}">${DOW[d.getDay()]}</div>
      <div class="week-date-num ${isToday?'today-num':''}">${d.getDate()}</div>
      <div class="week-bar-wrap">
        ${comp ? `<div class="week-bar-track"><div class="week-bar-fill ${isFull&&!isFuture?'wfull':''}" style="width:${isFuture?0:pct}%"></div></div>` : ''}
        <div class="week-acts">${comp ? comp.total+' activit'+(comp.total===1?'y':'ies') : 'Rest day'}</div>
      </div>
      <div class="week-score ${scoreClass}">${isFuture&&comp?'–':scoreStr}</div>
    </div>`;
  }
  html += '</div>';
  document.getElementById('view-week').innerHTML = html;

  document.querySelectorAll('.week-row').forEach(row => {
    const openSheet = () => openDaySheet(parseDate(row.dataset.date));
    row.addEventListener('click', openSheet);
    row.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){e.preventDefault();openSheet();} });
  });
}

function shiftWeek(dir) { weekOffset += dir; renderWeek(); }

/* ── MONTH VIEW ── */
function renderMonth() {
  const today = todayDate();
  const base = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth();
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // streak chips
  const streak = calcStreak();
  const activeDays = Object.keys(state.log).filter(ds => {
    const d = parseDate(ds);
    return activitiesFor(d).length > 0;
  }).length;

  let html = `<div class="month-nav">

  </div>

  <div class="month-grid">`;

  // blank cells before month start (week starts Monday)
  const startBlank = (firstDay === 0 ? 6 : firstDay - 1);
  for (let i = 0; i < startBlank; i++) html += '<div class="month-cell empty"></div>';

  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const ds = dateStr(d);
    const isToday = ds === dateStr(today);
    const isFuture = d > today;
    const comp = completionOf(d);
    const isFull = comp && !isFuture && comp.done === comp.total;
    const isPartial = comp && !isFuture && comp.done > 0 && !isFull;
    const isRest = !comp;

    let cls = 'month-cell';
    if (isToday) cls += ' today-cell';
    if (isFull) cls += ' full-cell';
    else if (isPartial) cls += ' partial-cell';
    if (isFuture) cls += ' future-cell';

    html += `<div class="${cls}" data-date="${ds}" role="button" tabindex="0" aria-label="${d.toLocaleDateString('en-GB',{weekday:'long',month:'long',day:'numeric'})}">
      <div class="mcell-num">${day}</div>
      ${!isRest && !isFuture ? '<div class="mcell-dot"></div>' : (isToday ? '<div class="mcell-dot"></div>' : '')}
    </div>`;
  }
  html += '</div>';

  html += `<div class="month-streak-row">
    <div class="streak-chip"><span class="streak-chip-icon">🔥</span> <strong>${streak}</strong> day streak</div>
    <div class="streak-chip"><span class="streak-chip-icon">✅</span> <strong>${activeDays}</strong> active days</div>
  </div>`;

  document.getElementById('view-month').innerHTML = html;

  document.querySelectorAll('.month-cell:not(.empty)').forEach(cell => {
    const openSheet = () => openDaySheet(parseDate(cell.dataset.date));
    cell.addEventListener('click', openSheet);
    cell.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){e.preventDefault();openSheet();} });
  });
}

function shiftMonth(dir) { monthOffset += dir; renderMonth(); }

function renderSheetActivities(dateObj, acts, isFuture) {
  const ds = dateStr(dateObj);
  const container = document.getElementById('sheet-acts');

  if (!isFuture) {

/* ── REPORT VIEW ── */
async function renderReport() {
  const today = todayDate();
  const base = new Date(today.getFullYear(), today.getMonth() + reportMonthOffset, 1);
  const year = base.getFullYear();
  const month = base.getMonth(); // 0-indexed
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cacheKey = `${year}-${String(month+1).padStart(2,'0')}`;

  const el = document.getElementById('view-report');

  // nav + loading state
  el.innerHTML = `
    <div class="report-nav">
      <button class="report-nav-btn" onclick="shiftReport(-1)">‹</button>
      <div class="report-month-title">${MONTHS[month]} ${year}</div>
      <button class="report-nav-btn" onclick="shiftReport(1)">›</button>
    </div>
    <div class="report-loading">Loading calendar events…</div>
  `;

  // fetch calendar if not cached
  if (!calendarCache[cacheKey]) {
    try {
      const res = await fetch(`${GS_URL}?action=calendar&month=${month+1}&year=${year}`);
      const json = await res.json();
      calendarCache[cacheKey] = json.events || [];
    } catch(e) {
      calendarCache[cacheKey] = null; // mark as failed
    }
  }

  const calEvents = calendarCache[cacheKey];

  // build calendar map: date -> events[]
  const calMap = {};
  if (calEvents) {
    calEvents.forEach(ev => {
      if (!calMap[ev.date]) calMap[ev.date] = [];
      calMap[ev.date].push(ev);
    });
  }

  // analyse each day of month
  let completeDays = 0, incompleteDays = 0, restDays = 0, futureDays = 0;
  const dayData = [];

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const ds = dateStr(dateObj);
    const isFuture = dateObj > today;
    const acts = activitiesFor(dateObj);
    const events = calMap[ds] || [];

    if (!acts.length) { restDays++; dayData.push({ dateObj, ds, type: 'rest', acts, events }); continue; }
    if (isFuture) { futureDays++; dayData.push({ dateObj, ds, type: 'future', acts, events }); continue; }

    const comp = completionOf(dateObj);
    const isFull = comp && comp.done === comp.total;
    const isPartial = comp && comp.done > 0 && !isFull;

    if (isFull) completeDays++;
    else incompleteDays++;

    dayData.push({ dateObj, ds, type: isFull ? 'complete' : isPartial ? 'partial' : 'miss', comp, acts, events });
  }

  const activeDays = completeDays + incompleteDays;
  const completePct = activeDays ? Math.round((completeDays / activeDays) * 100) : 0;

  // streak timeline
  let timelineHtml = '';
  dayData.forEach(({ dateObj, type, comp }) => {
    const label = dateObj.getDate();
    let cls = 'sc-future';
    if (type === 'complete') cls = 'sc-complete';
    else if (type === 'partial') cls = 'sc-partial';
    else if (type === 'miss') cls = 'sc-miss';
    else if (type === 'rest') cls = 'sc-rest';
    timelineHtml += `<div class="streak-cell ${cls}" title="${dateStr(dateObj)}">${label}</div>`;
  });

  // incomplete/partial days detail
  const problemDays = dayData.filter(d => d.type === 'miss' || d.type === 'partial');

  let problemHtml = '';
  if (problemDays.length === 0) {
    problemHtml = `<div class="report-empty">🎉 Perfect month — all active days completed!</div>`;
  } else {
    problemDays.forEach(({ dateObj, ds, type, comp, acts, events }) => {
      const dow = DOW_FULL[dateObj.getDay()];
      const dateLabel = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const scoreLabel = comp ? `${comp.done}/${comp.total}` : `0/${acts.length}`;
      const dotCls = type === 'partial' ? 'partial' : 'incomplete';
      const scoreCls = type === 'partial' ? '' : 'incomplete';

      // activities
      let actsHtml = acts.map(a => {
        const done = !!(state.log[ds] && state.log[ds][a.name]);
        return `<div class="report-act-row">
          <div class="report-act-icon">${a.icon}</div>
          <div class="report-act-name ${done ? 'done' : ''}">${a.name}</div>
        </div>`;
      }).join('');

      // calendar events
      let eventsHtml = '';
      if (calEvents === null) {
        eventsHtml = `<div class="report-cal-empty">Could not load calendar</div>`;
      } else if (events.length === 0) {
        eventsHtml = `<div class="report-cal-empty">No events found</div>`;
      } else {
        eventsHtml = events.map(ev => `
          <div class="report-event-row">
            <div class="report-event-dot"></div>
            <div style="flex:1;">
              <div class="report-event-title">${ev.title}</div>
              ${ev.calendar ? `<div style="font-size:11px;color:var(--text3);margin-top:1px;">${ev.calendar}</div>` : ''}
            </div>
            <div class="report-event-time">${ev.allDay ? 'all day' : ev.start + '–' + ev.end}</div>
          </div>`).join('');
      }

      problemHtml += `
        <div class="report-day-card ${type === 'partial' ? '' : 'incomplete'}">
          <div class="report-day-head" onclick="this.nextElementSibling.classList.toggle('open')">
            <div class="report-day-left">
              <div class="report-day-dot ${dotCls}"></div>
              <div>
                <div class="report-day-name">${dow}, ${dateLabel}</div>
                <div class="report-day-date">${type === 'partial' ? 'Partial' : 'Missed'}</div>
              </div>
            </div>
            <div class="report-day-score ${scoreCls}">${scoreLabel}</div>
          </div>
          <div class="report-day-body">
            <div class="report-sub-title">Activities</div>
            ${actsHtml}
            <div class="report-sub-title" style="margin-top:12px;">Calendar that day</div>
            ${eventsHtml}
          </div>
        </div>`;
    });
  }

  el.innerHTML = `
    <div class="report-nav">
      <button class="report-nav-btn" onclick="shiftReport(-1)">‹</button>
      <div class="report-month-title">${MONTHS[month]} ${year}</div>
      <button class="report-nav-btn" onclick="shiftReport(1)">›</button>
    </div>

    <div class="report-summary">
      <div class="report-stat"><div class="report-stat-n good">${completeDays}</div><div class="report-stat-l">full days</div></div>
      <div class="report-stat"><div class="report-stat-n bad">${incompleteDays}</div><div class="report-stat-l">missed days</div></div>
      <div class="report-stat"><div class="report-stat-n accent">${completePct}%</div><div class="report-stat-l">completion</div></div>
    </div>

    <div class="report-streak-section">
      <div class="report-section-title" style="margin-bottom:10px;">Month overview</div>
      <div class="streak-timeline">${timelineHtml}</div>
      <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);"><div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div> Complete</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);"><div style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></div> Partial</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);"><div style="width:8px;height:8px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border2)"></div> Missed</div>
      </div>
    </div>

    <div class="report-section-title">Incomplete days + calendar</div>
    ${problemHtml}
  `;
}

function shiftReport(dir) {
  reportMonthOffset += dir;
  calendarCache = {}; // clear cache on navigation
  renderReport();
}

/* ── RENDER ── */
function render() {
  if (currentView==='day') renderDay(todayDate());
  if (currentView==='week') renderWeek();
  if (currentView==='month') renderMonth();
}

/* ── BACKUP / RESTORE ── */
document.getElementById('backup-btn').addEventListener('click', () => {
  document.getElementById('backup-backdrop').classList.add('open');
});
document.getElementById('backup-backdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

document.getElementById('export-btn').addEventListener('click', async () => {
  document.getElementById('backup-backdrop').classList.remove('open');
  showToast('Saving to Supabase…');
  try {
    await syncToSupabase(state);
    showToast('Saved ✓');
  } catch(e) {
    showToast('Save failed — check connection');
  }
});

document.getElementById('import-btn').addEventListener('click', async () => {
  document.getElementById('backup-backdrop').classList.remove('open');
  showToast('Loading from Supabase…');
  await syncFromSupabase();
});

/* ── EDIT SCHEDULE ── */
let editingDay = null;

document.getElementById('edit-schedule-btn').addEventListener('click', () => {
  document.getElementById('backup-backdrop').classList.remove('open');
  openScheduleSheet();
});

function openScheduleSheet() {
  editingDay = null;
  document.getElementById('schedule-sheet-title').textContent = 'Edit Schedule';
  document.getElementById('schedule-sheet-sub').textContent = 'Tap a day to edit its activities';
  document.getElementById('schedule-edit-day').style.display = 'none';
  renderScheduleDayList();
  document.getElementById('schedule-backdrop').classList.add('open');
}

function closeScheduleSheet() {
  document.getElementById('schedule-backdrop').classList.remove('open');
}

document.getElementById('schedule-backdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeScheduleSheet();
});

function renderScheduleDayList() {
  const list = document.getElementById('schedule-day-list');
  // Mon first: 1,2,3,4,5,6,0
  const order = [1,2,3,4,5,6,0];
  list.innerHTML = order.map(dow => {
    const acts = (state.schedule && state.schedule[dow]) ? state.schedule[dow] : [];
    return `<div class="schedule-day-row" data-dow="${dow}">
      <div class="schedule-day-name">${DOW_FULL[dow]}</div>
      <div class="schedule-day-count">${acts.length} activit${acts.length===1?'y':'ies'}</div>
      <div class="schedule-day-arrow">›</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.schedule-day-row').forEach(row => {
    row.addEventListener('click', () => openDayEditor(parseInt(row.dataset.dow)));
  });
}

function openDayEditor(dow) {
  editingDay = dow;
  document.getElementById('schedule-sheet-title').textContent = DOW_FULL[dow];
  document.getElementById('schedule-sheet-sub').textContent = 'Add or remove activities';
  document.getElementById('schedule-day-list').innerHTML = '';
  const editDiv = document.getElementById('schedule-edit-day');
  editDiv.style.display = 'block';

  // back button
  const backHtml = `<div class="schedule-back-btn" id="schedule-back-btn">‹ All days</div>`;
  renderDayActivities(dow, backHtml);

  document.getElementById('schedule-new-input').value = '';
}

function renderDayActivities(dow, backHtml = '') {
  if (!state.schedule) state.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  const acts = state.schedule[dow] || [];
  const container = document.getElementById('schedule-act-list');

  container.innerHTML = (backHtml ? `<div style="padding:4px 0 8px;">${backHtml}</div>` : '') +
    (acts.length === 0 ? '<div style="font-size:13px;color:var(--text3);padding:8px 0;">No activities — add one below.</div>' : '') +
    acts.map((a, i) => `
      <div class="schedule-act-item">
        <div class="schedule-act-icon-input" data-idx="${i}" title="Tap to change emoji">${a.icon}</div>
        <div class="schedule-act-name">${a.name}</div>
        <div class="schedule-act-del" data-idx="${i}">×</div>
      </div>`).join('');

  // back button
  const backBtn = document.getElementById('schedule-back-btn');
  if (backBtn) backBtn.addEventListener('click', () => {
    editingDay = null;
    document.getElementById('schedule-edit-day').style.display = 'none';
    document.getElementById('schedule-sheet-title').textContent = 'Edit Schedule';
    document.getElementById('schedule-sheet-sub').textContent = 'Tap a day to edit its activities';
    renderScheduleDayList();
  });

  // delete buttons
  container.querySelectorAll('.schedule-act-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      state.schedule[dow].splice(idx, 1);
      save(state);
      render();
      renderDayActivities(dow);
    });
  });

  // emoji picker on icon tap
  container.querySelectorAll('.schedule-act-icon-input').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const emojis = ['📖','🏃','🚶','🧘','🤖','🏋️','💧','🧠','✏️','🌙','🎯','🥗','🛁','📵','🎨','🎸','🧹','💼','🏊','🚴'];
      const current = state.schedule[dow][idx].icon;
      const next = emojis[(emojis.indexOf(current) + 1) % emojis.length];
      state.schedule[dow][idx].icon = next;
      save(state);
      render();
      renderDayActivities(dow);
    });
  });
}

document.getElementById('schedule-add-btn').addEventListener('click', addScheduleActivity);
document.getElementById('schedule-new-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { addScheduleActivity(); e.target.blur(); }
});

function addScheduleActivity() {
  const inp = document.getElementById('schedule-new-input');
  const val = inp.value.trim();
  if (!val || editingDay === null) return;
  if (!state.schedule) state.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
  if (!state.schedule[editingDay]) state.schedule[editingDay] = [];
  // check duplicate
  if (state.schedule[editingDay].find(a => a.name === val)) {
    showToast('Already in this day');
    inp.value = '';
    return;
  }
  state.schedule[editingDay].push({ icon: '🎯', name: val });
  save(state);
  render();
  inp.value = '';
  renderDayActivities(editingDay);
  showToast('Activity added');
}

/* ── SERVICE WORKER ── */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

render();
syncFromSupabase();
</script>
</body>
</html>
